# /etc/nginx/sites-available/etermory  (vm-proxy, 192.168.56.10)
# Balanceador com failover entre app1 e app2.

# Formato de log com a instância que respondeu (upstream) e os tempos:
# é ele que mostra no teste de indisponibilidade quem atendeu cada pedido.
log_format etermory '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                    'upstream=$upstream_addr upstream_status=$upstream_status '
                    'tempo=$request_time tempo_upstream=$upstream_response_time';

upstream etermory_app {
    # Round-robin: um pedido para cada instância, alternando.
    # max_fails=2 + fail_timeout=15s: depois de 2 falhas em 15 s a instância
    # sai do balanceamento por 15 s; depois o Nginx tenta de novo sozinho.
    server 192.168.56.11:8000 max_fails=2 fail_timeout=15s;   # vm-app1
    server 192.168.56.12:8000 max_fails=2 fail_timeout=15s;   # vm-app2
    keepalive 16;   # reaproveita conexões com o Gunicorn
}

# Porta 80: redireciona para HTTPS. /saude fica liberada em HTTP para o
# script de teste de failover.
server {
    listen 80 default_server;
    server_name _;

    access_log /var/log/nginx/etermory_access.log etermory;
    error_log  /var/log/nginx/etermory_error.log warn;

    location = /saude {
        proxy_pass http://etermory_app;
        include /etc/nginx/snippets/etermory-proxy.conf;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name _;

    # Certificado autoassinado gerado pelo scripts/provisionar/proxy.sh
    ssl_certificate     /etc/ssl/etermory/etermory.crt;
    ssl_certificate_key /etc/ssl/etermory/etermory.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/etermory_access.log etermory;
    error_log  /var/log/nginx/etermory_error.log warn;

    client_max_body_size 12m;   # igual ao MAX_CONTENT_LENGTH do Flask

    # Cabeçalhos de segurança
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    # Só para a demonstração: mostra qual instância respondeu.
    add_header X-Etermory-Upstream $upstream_addr always;

    location / {
        proxy_pass http://etermory_app;
        include /etc/nginx/snippets/etermory-proxy.conf;
    }
}
