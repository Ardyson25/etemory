# /etc/nginx/snippets/etermory-proxy.conf
# Incluído em cada "location" que encaminha para o upstream etermory_app.

proxy_http_version 1.1;
proxy_set_header Connection "";              # necessário para o keepalive
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# Failover: se a instância recusar a conexão, demorar para conectar ou
# devolver 502/503/504, o MESMO pedido é repassado para a outra instância.
# (Pedidos POST só são repetidos se a conexão nem chegou a ser aceita, para
# não duplicar uma publicação.)
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 2;
proxy_next_upstream_timeout 10s;

proxy_connect_timeout 2s;   # instância desligada é detectada em até 2 s
proxy_read_timeout 60s;     # igual ao timeout do Gunicorn
proxy_send_timeout 60s;
